name: Site quality checks
on:
  push:
    branches:
      - redesign/four-worlds
  pull_request:
    branches:
      - main
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript, structure, and inquiry API
        run: npm test
